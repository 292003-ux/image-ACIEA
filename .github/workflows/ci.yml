name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aciea
          POSTGRES_PASSWORD: aciea_ci
          POSTGRES_DB: aciea_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aciea" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aciea:aciea_ci@localhost:5432/aciea_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - name: Build
        run: pnpm build
        env:
          PAYLOAD_SECRET: ci-build-secret-0123456789abcdef0123456789
          DATABASE_URL: postgres://aciea:aciea_ci@localhost:5432/aciea_test
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000
