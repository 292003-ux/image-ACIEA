# Local PostgreSQL for development: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aciea
      POSTGRES_USER: aciea
      POSTGRES_PASSWORD: aciea_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dev-db:/var/lib/postgresql/data
volumes:
  dev-db:
